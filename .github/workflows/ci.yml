name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vega-plugin-ending-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ending plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vega-plugin-ending
          persist-credentials: false

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: vega-plugin-ending/.dependencies/vega
          persist-credentials: false
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vega-plugin-ending/pnpm-lock.yaml
      - name: Set up locked Vega Rust and WASM tools
        uses: ./vega-plugin-ending/.dependencies/vega/.github/actions/setup-wasm

      - name: Install dependencies
        working-directory: vega-plugin-ending
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: vega-plugin-ending
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Vega core
        working-directory: vega-plugin-ending
        run: pnpm --filter @haneoka/vega build:core

      - name: Check package
        working-directory: vega-plugin-ending
        run: pnpm check

      - name: Verify package archive
        working-directory: vega-plugin-ending
        run: pnpm pack --dry-run
